apiVersion: apps/v1
kind: Deployment
metadata:
  name: zenx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zenx
  template:
    metadata:
      labels:
        app: zenx
    spec:
      containers:
      - name: zenx
        image: zenx:latest
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet: { path: /readyz, port: 8080 }
        livenessProbe:
          httpGet: { path: /livez, port: 8080 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zenx-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zenx
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
